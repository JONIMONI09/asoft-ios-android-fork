name: Build UX & Stability Test APK

on:
  push:
    branches:
      - work-ci-branch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work-ci-branch
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore persistent debug keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: asoft-debug-keystore-v1

      - name: Generate debug keystore if missing
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Android NDK 29 and CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;29.0.13846066" "cmake;3.22.1"

      - name: Fetch 0.1.7 prebuilt libs & assets
        run: |
          curl -fL "https://github.com/alpersamur3/asoft-ios-android/releases/download/v0.1.7/ASoftware-iOS-Android-0.1.7.apk" -o /tmp/base017.apk
          python3 - <<'PY'
          import os, shutil, zipfile
          jni1 = "app/src/main/jniLibs/arm64-v8a"
          jni26 = "app/src/main/jniLibs26/arm64-v8a"
          assets = "app/src/main/assets"
          os.makedirs(jni1, exist_ok=True)
          os.makedirs(jni26, exist_ok=True)
          os.makedirs(assets, exist_ok=True)
          libs26 = {"libqemu26.so", "lib_libvulkan_freedreno.so.so", "lib_libvulkan.so.so"}
          skip_libs = {"libconscrypt_jni.so", "libgpucheck.so", "librender.so", "libunpack.so"}
          with zipfile.ZipFile("/tmp/base017.apk") as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  if info.filename.startswith("lib/arm64-v8a/"):
                      name = os.path.basename(info.filename)
                      if name in skip_libs:
                          continue
                      dst = os.path.join(jni26 if name in libs26 else jni1, name)
                      with z.open(info) as s, open(dst, "wb") as o:
                          shutil.copyfileobj(s, o)
                      if name in ("libqemu.so", "libqemu26.so", "libqemuimg.so"):
                          os.chmod(dst, 0o755)
                  elif info.filename.startswith("assets/"):
                      rel = info.filename[len("assets/"):]
                      dst = os.path.join(assets, rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      with z.open(info) as s, open(dst, "wb") as o:
                          shutil.copyfileobj(s, o)
          PY

      - name: Run unit tests & build signed debug APK
        run: |
          cat > /tmp/mirror.init.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org')) {
                      repo.url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org')) {
                      repo.url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                  }
              }
          }
          EOF
          bash ./gradlew -I /tmp/mirror.init.gradle testDebugUnitTest assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --console=plain --max-workers=2
          cp app/build/outputs/apk/debug/app-debug.apk ASoftware-iOS-Android-0.1.7-ux-stability-debug.apk

      - name: Upload workflow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASoftware-iOS-Android-0.1.7-ux-stability-debug
          path: ASoftware-iOS-Android-0.1.7-ux-stability-debug.apk

      - name: Publish pre-release APK on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="v0.1.7-advanced-${{ github.run_number }}"
          gh release create "$TAG" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "0.1.7 Advanced Test APK #$GITHUB_RUN_NUMBER ($SHORT_SHA)" \
            --notes "Signed debug APK built from work-ci-branch ($SHORT_SHA). Includes kgsl_shim.c deadlock fix, passive BootDiagnostics, ? Help dialog, PR #371 review fixes, and untouched upstream Wireless Debugging pairing." \
            ASoftware-iOS-Android-0.1.7-ux-stability-debug.apk
